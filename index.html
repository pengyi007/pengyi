    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        summer: {
                            light: '#f0fdf4',
                            DEFAULT: '#86efac',
                            dark: '#16a34a',
                            deep: '#14532d',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }

        // 配置 Markdown 渲染 + 代码高亮
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (e) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // 链接自动新窗口打开
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a href="${href}" title="${title || ''}" target="_blank" rel="noopener noreferrer">${text}</a>`;
        };
        marked.use({ renderer });
    </script>
    <style type="text/tailwindcss">

    <script>
        // ==============================================
        // ========== 🔧 仓库配置区 ==========
        // ==============================================
        const REPO_CONFIG = [
            {
                key: 'frontend-notes',
                name: 'Python',
                desc: 'python学习笔记',
                owner: 'pengyi007',
                repo: 'Study_Python',
                branch: 'main',
                rootPath: '',
                icon: '&lt;/&gt;',
                iconBg: 'bg-blue-500'
            },
            {
                key: 'backend-notes',
                name: '运维',
                desc: 'linux,中间件,shell',
                owner: 'pengyi007',
                repo: 'Study_Ops',
                branch: 'main',
                rootPath: '',
                icon: '🖥️',
                iconBg: 'bg-purple-500'
            }
        ];

        const GITHUB_TOKEN = '';
        const API_BASE = 'https://api.github.com';
        // ==============================================

        let currentRepoKey = '';
        let currentPath = '';

        // ========== 工具函数 ==========
        function getRawUrl(repoKey, filePath) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return '';
            return `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${repo.branch}/${filePath}`;
        }

        function resolveMarkdownImages(markdown, repoKey, currentFilePath) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return markdown;

            const dirPath = currentFilePath.includes('/') 
                ? currentFilePath.substring(0, currentFilePath.lastIndexOf('/')) 
                : '';

            return markdown.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, imgPath) => {
                if (imgPath.startsWith('http://') || imgPath.startsWith('https://') || imgPath.startsWith('data:')) {
                    return match;
                }
                let fullPath;
                if (imgPath.startsWith('/')) {
                    fullPath = imgPath.slice(1);
                } else {
                    fullPath = dirPath ? `${dirPath}/${imgPath}` : imgPath;
                }
                const rawUrl = getRawUrl(repoKey, fullPath);
                return `![${alt}](${rawUrl})`;
            });
        }

        // 自动生成目录
        function generateToc() {
            const contentEl = document.getElementById('modalContent');
            const tocEl = document.getElementById('tocList');
            const headings = contentEl.querySelectorAll('h2, h3');
            
            if (headings.length === 0) {
                tocEl.innerHTML = '<div class="text-sm text-gray-400 px-3 py-2">暂无目录</div>';
                return;
            }

            let html = '';
            headings.forEach((heading, index) => {
                const id = `heading-${index}`;
                heading.id = id;
                const level = heading.tagName.toLowerCase();
                const text = heading.textContent;
                html += `<div class="toc-item toc-${level}" onclick="scrollToHeading('${id}')">${text}</div>`;
            });
            tocEl.innerHTML = html;

            // 滚动监听高亮当前标题
            const contentScroll = document.getElementById('modalContent');
            contentScroll.onscroll = () => {
                let currentId = '';
                headings.forEach(heading => {
                    const rect = heading.getBoundingClientRect();
                    if (rect.top <= 80) {
                        currentId = heading.id;
                    }
                });

                document.querySelectorAll('.toc-item').forEach(item => {
                    item.classList.remove('active');
                });
                if (currentId) {
                    const activeItem = document.querySelector(`.toc-item[onclick="scrollToHeading('${currentId}')"]`);
                    if (activeItem) activeItem.classList.add('active');
                }
            };
        }

        function scrollToHeading(id) {
            const el = document.getElementById(id);
            if (el) {
                document.getElementById('modalContent').scrollTo({
                    top: el.offsetTop - 20,
                    behavior: 'smooth'
                });
            }
        }

        // ========== GitHub API 封装 ==========
        async function githubRequest(url) {
            const headers = {
                'Accept': 'application/vnd.github.v3+json'
            };
            if (GITHUB_TOKEN) {
                headers['Authorization'] = `token ${GITHUB_TOKEN}`;
            }
            
            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error('请求失败：' + res.status + '，请检查仓库配置或 Token');
            return res.json();
        }

        async function getRepoContents(repoKey, path = '') {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return [];
            
            const fullPath = path ? path : repo.rootPath;
            const url = `${API_BASE}/repos/${repo.owner}/${repo.repo}/contents/${encodeURIComponent(fullPath)}?ref=${repo.branch}`;
            const data = await githubRequest(url);
            
            return data.sort((a, b) => {
                if (a.type === 'dir' && b.type === 'file') return -1;
                if (a.type === 'file' && b.type === 'dir') return 1;
                return a.name.localeCompare(b.name);
            });
        }

        async function getFileContent(repoKey, path) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return '';
            
            const url = `${API_BASE}/repos/${repo.owner}/${repo.repo}/contents/${encodeURIComponent(path)}?ref=${repo.branch}`;
            const data = await githubRequest(url);
            
            if (data.encoding === 'base64') {
                return decodeURIComponent(escape(window.atob(data.content)));
            }
            return data.content || '';
        }

        // ========== 页面初始化 ==========
        window.onload = function() {
            renderLandingStats();
            renderHomeRepoCards();
            renderSidebar();
        };

        function renderLandingStats() {
            document.getElementById('totalRepoCount').textContent = REPO_CONFIG.length;
            document.getElementById('statRepoCount').textContent = REPO_CONFIG.length;
        }

        function renderHomeRepoCards() {
            const grid = document.getElementById('repoCardGrid');
            grid.innerHTML = '';

            REPO_CONFIG.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-6 cursor-pointer transition-all hover:scale-105 hover:shadow-lg';
                card.innerHTML = `
                    <div class="category-icon ${repo.iconBg} mb-4">${repo.icon}</div>
                    <h3 class="text-lg font-bold text-gray-800 mb-1">${repo.name}</h3>
                    <p class="text-sm text-gray-600 mb-4">${repo.desc}</p>
                    <div class="flex justify-between items-end">
                        <span class="text-sm text-gray-500">GitHub 仓库</span>
                        <span class="text-xs bg-summer/30 text-summer-deep px-3 py-1 rounded-full">只读</span>
                    </div>
                `;
                card.onclick = () => openCategory(repo.key);
                grid.appendChild(card);
            });
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';

            REPO_CONFIG.forEach(repo => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-2.5 rounded-lg hover:bg-white/50 transition-colors flex items-center gap-3 text-gray-700';
                btn.innerHTML = `
                    <span class="w-6 h-6 rounded ${repo.iconBg} text-white text-xs flex items-center justify-center">${repo.icon}</span>
                    ${repo.name}
                `;
                btn.onclick = () => openCategory(repo.key);
                nav.appendChild(btn);
            });
        }

        // ========== 页面切换逻辑 ==========
        function enterLibrary() {
            const landing = document.getElementById('landingView');
            const app = document.getElementById('appView');
            
            landing.style.opacity = '0';
            landing.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                landing.classList.add('hidden');
                app.classList.remove('hidden');
                requestAnimationFrame(() => {
                    app.style.opacity = '0';
                    app.style.transform = 'translateY(10px)';
                    requestAnimationFrame(() => {
                        app.style.opacity = '1';
                        app.style.transform = 'translateY(0)';
                    });
                });
            }, 300);
        }

        function backToLanding() {
            const landing = document.getElementById('landingView');
            const app = document.getElementById('appView');
            
            app.style.opacity = '0';
            app.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                app.classList.add('hidden');
                landing.classList.remove('hidden');
                requestAnimationFrame(() => {
                    landing.style.opacity = '0';
                    landing.style.transform = 'translateY(-10px)';
                    requestAnimationFrame(() => {
                        landing.style.opacity = '1';
                        landing.style.transform = 'translateY(0)';
                    });
                });
            }, 300);

            goHome();
            closeModal();
        }

        function goHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('shelfView').classList.add('hidden');
            closeModal();
        }

        // ========== 书架浏览逻辑 ==========
        function openCategory(repoKey) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return;

            currentRepoKey = repoKey;
            currentPath = repo.rootPath || '';

            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('shelfView').classList.remove('hidden');
            document.getElementById('categoryTitle').textContent = repo.name;

            loadShelfData();
        }

        async function loadShelfData() {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">加载中...</div>';
            renderBreadcrumb();

            try {
                const list = await getRepoContents(currentRepoKey, currentPath);
                grid.innerHTML = '';

                if (currentPath && currentPath !== REPO_CONFIG.find(r=>r.key===currentRepoKey).rootPath) {
                    const backCard = document.createElement('div');
                    backCard.className = 'book-card glass-card rounded-2xl p-6 flex flex-col items-center justify-center text-center min-h-[200px]';
                    backCard.innerHTML = `
                        <div class="text-4xl mb-3">📁</div>
                        <h4 class="font-bold text-gray-800">返回上级</h4>
                    `;
                    backCard.onclick = goBackDir;
                    grid.appendChild(backCard);
                }

                list.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'book-card glass-card rounded-2xl overflow-hidden';
                    
                    if (item.type === 'dir') {
                        card.innerHTML = `
                            <div class="h-32 bg-gradient-to-br from-amber-200/60 to-amber-400/60 flex items-center justify-center text-white text-4xl">
                                📁
                            </div>
                            <div class="p-5">
                                <h4 class="font-bold text-gray-800 mb-1 line-clamp-2">${item.name}</h4>
                                <p class="text-xs text-gray-500">文件夹</p>
                            </div>
                        `;
                        card.onclick = () => enterDir(item.path);
                        grid.appendChild(card);
                    } else {
                        const isViewable = /\.(md|txt|js|css|html|json|vue|py|java|go|ts|jsx|tsx|yml|yaml|conf|ini|png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(item.name);
                        if (!isViewable) return;

                        const isImage = /\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(item.name);
                        const fileIcon = isImage ? '🖼️' : '📄';
                        const gradientClass = isImage 
                            ? 'bg-gradient-to-br from-pink-200/60 to-rose-400/60' 
                            : 'bg-gradient-to-br from-summer/60 to-summer-dark/60';

                        card.innerHTML = `
                            <div class="h-32 ${gradientClass} flex items-center justify-center text-white text-4xl">
                                ${fileIcon}
                            </div>
                            <div class="p-5">
                                <h4 class="font-bold text-gray-800 mb-1 line-clamp-2">${item.name}</h4>
                                <p class="text-xs text-gray-500">${(item.size / 1024).toFixed(1)} KB</p>
                            </div>
                        `;
                        card.onclick = () => openDocFile(item.path, item.name);
                        grid.appendChild(card);
                    }
                });

                document.getElementById('docCount').textContent = `共 ${list.length} 项`;

            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">${err.message}</div>`;
            }
        }

        function renderBreadcrumb() {
            const breadcrumb = document.getElementById('pathBreadcrumb');
            const repo = REPO_CONFIG.find(r => r.key === currentRepoKey);
            const rootPath = repo.rootPath || '';
            
            let pathArr = [];
            if (currentPath) {
                pathArr = currentPath.replace(rootPath, '').split('/').filter(Boolean);
            }

            let html = `<span class="text-summer-deep font-medium cursor-pointer" onclick="openCategory('${currentRepoKey}')">${repo.name}</span>`;
            
            let tempPath = rootPath;
            pathArr.forEach((dir, index) => {
                tempPath = tempPath ? `${tempPath}/${dir}` : dir;
                html += `<span class="text-gray-400">/</span>`;
                if (index === pathArr.length - 1) {
                    html += `<span class="text-gray-700">${dir}</span>`;
                } else {
                    html += `<span class="text-summer-deep cursor-pointer hover:underline" onclick="jumpToPath('${tempPath}')">${dir}</span>`;
                }
            });

            breadcrumb.innerHTML = html;
        }

        function enterDir(path) {
            currentPath = path;
            loadShelfData();
        }

        function jumpToPath(path) {
            currentPath = path;
            loadShelfData();
        }

        function goBackDir() {
            const pathArr = currentPath.split('/');
            pathArr.pop();
            currentPath = pathArr.join('/');
            loadShelfData();
        }

        // ========== 文档弹窗 ==========
        async function openDocFile(filePath, fileName) {
            const repo = REPO_CONFIG.find(r => r.key === currentRepoKey);
            
            document.getElementById('modalTitle').textContent = fileName;
            document.getElementById('modalMeta').textContent = `${repo.name} · ${filePath}`;
            document.getElementById('modalContent').innerHTML = '<div class="text-center text-gray-500 py-20">加载中...</div>';
            document.getElementById('tocList').innerHTML = '';

            const modal = document.getElementById('docModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const isImage = /\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(fileName);
                if (isImage) {
                    const imgUrl = getRawUrl(currentRepoKey, filePath);
                    document.getElementById('modalContent').innerHTML = `
                        <div class="flex justify-center items-center h-full">
                            <img src="${imgUrl}" alt="${fileName}" class="max-w-full max-h-[75vh] rounded-lg shadow-md">
                        </div>
                    `;
                    return;
                }

                const isMarkdown = /\.md$/i.test(fileName);
                const content = await getFileContent(currentRepoKey, filePath);

                if (isMarkdown) {
                    const resolvedContent = resolveMarkdownImages(content, currentRepoKey, filePath);
                    const html = marked.parse(resolvedContent);
                    document.getElementById('modalContent').innerHTML = `<div class="markdown-body">${html}</div>`;
                    // 渲染完生成目录
                    setTimeout(generateToc, 0);
                } else {
                    document.getElementById('modalContent').innerHTML = `<pre class="bg-gray-50 p-6 rounded-lg overflow-x-auto text-sm">${content}</pre>`;
                }
            } catch (err) {
                document.getElementById('modalContent').innerHTML = `<div class="text-red-500 text-center py-20">文件读取失败：${err.message}</div>`;
            }
        }

        function closeModal() {
            const modal = document.getElementById('docModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('docModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
