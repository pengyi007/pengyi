<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>彭逸的学习空间</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f2f9f4',
                            100: '#e1f4e7',
                            200: '#bfeacc',
                            300: '#8dd9a7',
                            400: '#4fbf7a',
                            500: '#2ba95b',
                            600: '#1a8a47',
                            700: '#166534',
                            800: '#14532d',
                            900: '#052e16'
                        }
                    },
                    fontFamily: {
                        sans: [
                            'system-ui',
                            '-apple-system',
                            'BlinkMacSystemFont',
                            '"Segoe UI"',
                            'PingFang SC',
                            '"Hiragino Sans GB"',
                            '"Microsoft YaHei"',
                            'sans-serif'
                        ],
                        mono: [
                            'JetBrains Mono',
                            'Fira Code',
                            'Consolas',
                            '"Courier New"',
                            'monospace'
                        ]
                    }
                }
            }
        };

        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (e) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        const renderer = new marked.Renderer();
        renderer.link = function (href, title, text) {
            return `<a href="${href}" title="${title || ''}" target="_blank" rel="noopener noreferrer">${text}</a>`;
        };
        marked.use({ renderer });
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                PingFang SC, "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f7fbf8;
            color: #1f2937;
        }

        a {
            color: inherit;
        }

        /* 页面过渡 */
        .view-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* 入口页 */
        .landing {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(circle at 15% 20%, rgba(79, 191, 122, 0.18), transparent 26%),
                radial-gradient(circle at 85% 80%, rgba(43, 169, 91, 0.15), transparent 28%),
                linear-gradient(180deg, #f7fbf8 0%, #eef7f2 100%);
        }

        .landing-inner {
            width: 100%;
            max-width: 960px;
            text-align: center;
        }

        .logo-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: white;
            background: linear-gradient(135deg, #4fbf7a 0%, #166534 100%);
            box-shadow: 0 10px 30px rgba(22, 101, 52, 0.25);
        }

        .landing h1 {
            margin: 0 0 10px;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #052e16;
        }

        .landing p.subtitle {
            margin: 0 auto 34px;
            max-width: 640px;
            font-size: 16px;
            line-height: 1.8;
            color: #4b5563;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 36px;
        }

        .repo-card {
            background: white;
            border: 1px solid #e5f1e7;
            border-radius: 16px;
            padding: 24px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(22, 101, 52, 0.06);
        }

        .repo-card:hover {
            transform: translateY(-4px);
            border-color: #bfeacc;
            box-shadow: 0 14px 34px rgba(22, 101, 52, 0.12);
        }

        .repo-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            margin-bottom: 14px;
        }

        .repo-icon.python {
            background: linear-gradient(135deg, #38bdf8, #10b981);
        }

        .repo-icon.linux {
            background: linear-gradient(135deg, #1f2937, #166534);
        }

        .repo-card h3 {
            margin: 0 0 4px;
            font-size: 20px;
            font-weight: 700;
            color: #052e16;
        }

        .repo-card p {
            margin: 0;
            font-size: 14px;
            color: #6b7280;
        }

        .btn-primary {
            border: 0;
            cursor: pointer;
            background: linear-gradient(135deg, #2ba95b, #166534);
            color: white;
            padding: 14px 34px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 10px 24px rgba(22, 101, 52, 0.25);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(22, 101, 52, 0.3);
        }

        .tip {
            margin-top: 22px;
            font-size: 13px;
            color: #9ca3af;
        }

        /* 主布局 */
        .app {
            display: none;
            min-height: 100vh;
            background: #f7fbf8;
        }

        .app.show {
            display: block;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5f1e7;
        }

        .topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: #052e16;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: linear-gradient(135deg, #4fbf7a, #166534);
        }

        .back-btn {
            border: 1px solid #e5f1e7;
            background: white;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: #bfeacc;
            color: #166534;
        }

        .layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 24px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 88px;
            background: white;
            border: 1px solid #e5f1e7;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(22, 101, 52, 0.04);
        }

        .sidebar-title {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-menu button {
            border: 0;
            background: transparent;
            text-align: left;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .sidebar-menu button:hover {
            background: #f0faf4;
            color: #166534;
        }

        .sidebar-menu button.active {
            background: #e1f4e7;
            color: #052e16;
            font-weight: 600;
        }

        .sidebar-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .content {
            min-width: 0;
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 22px;
            font-weight: 700;
            color: #052e16;
        }

        .card {
            background: white;
            border: 1px solid #e5f1e7;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(22, 101, 52, 0.04);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            padding: 16px;
            border-radius: 12px;
            background: #f0faf4;
            border: 1px solid #e1f4e7;
        }

        .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: #166534;
        }

        .stat-label {
            margin-top: 4px;
            font-size: 13px;
            color: #6b7280;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e5f1e7;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #8dd9a7, #166534);
            border-radius: 999px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .file-card {
            background: white;
            border: 1px solid #e5f1e7;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(22, 101, 52, 0.04);
        }

        .file-card:hover {
            transform: translateY(-4px);
            border-color: #bfeacc;
            box-shadow: 0 14px 30px rgba(22, 101, 52, 0.1);
        }

        .file-cover {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }

        .file-cover.folder {
            background: linear-gradient(135deg, #fde68a, #f59e0b);
        }

        .file-cover.doc {
            background: linear-gradient(135deg, #a7f3d0, #10b981);
        }

        .file-cover.img {
            background: linear-gradient(135deg, #fbcfe8, #f472b6);
        }

        .file-body {
            padding: 16px;
        }

        .file-name {
            margin: 0 0 4px;
            font-size: 15px;
            font-weight: 600;
            color: #111827;
        }

        .file-meta {
            margin: 0;
            font-size: 13px;
            color: #6b7280;
        }

        .breadcrumb {
            margin-bottom: 16px;
            font-size: 14px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .breadcrumb a {
            color: #166534;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb .sep {
            color: #d1d5db;
        }

        .breadcrumb .current {
            color: #111827;
            font-weight: 500;
        }

        /* 弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(4px);
        }

        .modal-mask.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 1400px;
            height: 92vh;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.24);
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid #e5f1e7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fcfefd;
        }

        .modal-title {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            color: #052e16;
        }

        .modal-subtitle {
            margin: 4px 0 0;
            font-size: 13px;
            color: #6b7280;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #e5f1e7;
            background: white;
            cursor: pointer;
            font-size: 16px;
            color: #374151;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: #f0faf4;
            color: #166534;
        }

        .modal-body {
            flex: 1;
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 0;
        }

        .toc {
            border-right: 1px solid #e5f1e7;
            background: #fcfefd;
            overflow-y: auto;
            padding: 20px;
        }

        .toc h4 {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .toc-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .toc-item {
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.5;
        }

        .toc-item:hover {
            background: #f0faf4;
            color: #166534;
        }

        .toc-item.active {
            background: #e1f4e7;
            color: #052e16;
            font-weight: 600;
        }

        .toc-item.h3 {
            padding-left: 24px;
            font-size: 13px;
            color: #6b7280;
        }

        .doc {
            overflow-y: auto;
            padding: 30px 40px;
            background: white;
        }

        .doc img {
            max-width: 100%;
            border-radius: 10px;
        }

        .doc pre {
            background: #f6f8fa;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            overflow-x: auto;
        }

        .doc code {
            font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
        }

        .image-view {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }

        .image-view img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        /* Markdown 样式 */
        .markdown-body {
            max-width: 780px;
            margin: 0 auto;
            color: #1f2937;
            font-size: 16px;
            line-height: 1.85;
        }

        .markdown-body h1 {
            font-size: 30px;
            margin: 0 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5f1e7;
            color: #052e16;
        }

        .markdown-body h2 {
            font-size: 24px;
            margin: 36px 0 14px;
            padding-left: 12px;
            border-left: 4px solid #4fbf7a;
            color: #166534;
        }

        .markdown-body h3 {
            font-size: 20px;
            margin: 28px 0 12px;
            color: #15803d;
        }

        .markdown-body h4 {
            font-size: 17px;
            margin: 22px 0 10px;
            color: #166534;
        }

        .markdown-body p {
            margin: 14px 0;
            text-align: justify;
        }

        .markdown-body strong {
            color: #052e16;
            font-weight: 600;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 24px;
            margin: 14px 0;
        }

        .markdown-body li {
            margin: 6px 0;
        }

        .markdown-body blockquote {
            border-left: 4px solid #4fbf7a;
            background: #f0faf4;
            padding: 12px 16px;
            color: #4b5563;
            border-radius: 0 10px 10px 0;
            margin: 18px 0;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            font-size: 15px;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #d1fae5;
            padding: 10px 14px;
            text-align: left;
        }

        .markdown-body th {
            background: #e1f4e7;
            color: #166534;
            font-weight: 600;
        }

        .markdown-body tr:nth-child(even) td {
            background: #f7fbf8;
        }

        .markdown-body hr {
            border: 0;
            border-top: 1px solid #e5f1e7;
            margin: 30px 0;
        }

        .markdown-body a {
            color: #16a34a;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        /* 滚动条 */
        .doc::-webkit-scrollbar,
        .toc::-webkit-scrollbar {
            width: 8px;
        }

        .doc::-webkit-scrollbar-thumb,
        .toc::-webkit-scrollbar-thumb {
            background: #d1fae5;
            border-radius: 4px;
        }

        .doc::-webkit-scrollbar-thumb:hover,
        .toc::-webkit-scrollbar-thumb:hover {
            background: #4fbf7a;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }

            .modal-body {
                grid-template-columns: 1fr;
            }

            .toc {
                display: none;
            }

            .repo-grid {
                grid-template-columns: 1fr;
            }

            .stat-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .file-grid {
                grid-template-columns: 1fr;
            }

            .landing h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- 入口页 -->
    <section class="landing view-transition" id="landingView">
        <div class="landing-inner">
            <div class="logo-mark">📚</div>
            <h1>编程学习知识库</h1>
            <p class="subtitle">
                把 Python 与 Linux 运维笔记整理成可在线阅读的知识库，点击仓库卡片进入对应目录。
            </p>

            <div class="repo-grid">
                <div class="repo-card" onclick="openCategory('frontend-notes')">
                    <div class="repo-icon python">🐍</div>
                    <h3>Python</h3>
                    <p>Python 学习笔记</p>
                </div>

                <div class="repo-card" onclick="openCategory('backend-notes')">
                    <div class="repo-icon linux">🐧</div>
                    <h3>运维</h3>
                    <p>Linux / Shell / 中间件</p>
                </div>
            </div>

            <button class="btn-primary" onclick="enterLibrary()">进入知识库</button>
            <div class="tip">按 ESC 可关闭文档弹窗</div>
        </div>
    </section>

    <!-- 主应用 -->
    <div class="app" id="appView">
        <header class="topbar">
            <div class="topbar-inner">
                <div class="brand">
                    <div class="brand-mark">📚</div>
                    <span>编程学习知识库</span>
                </div>
                <button class="back-btn" onclick="backToLanding()">← 返回首页</button>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <p class="sidebar-title">导航</p>
                <nav class="sidebar-menu">
                    <button id="homeBtn" onclick="goHome()">🏠 首页看板</button>
                </nav>

                <p class="sidebar-title" style="margin-top:18px;">仓库</p>
                <nav class="sidebar-menu" id="sidebarNav"></nav>
            </aside>

            <main class="content">
                <!-- 首页看板 -->
                <div id="homeView">
                    <h2 class="section-title">首页看板</h2>

                    <div class="card" style="margin-bottom:20px;">
                        <div class="stat-grid">
                            <div class="stat-item">
                                <div class="stat-num" id="statRepoCount">2</div>
                                <div class="stat-label">仓库数量</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-num">实时</div>
                                <div class="stat-label">内容同步</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-num">GET</div>
                                <div class="stat-label">只读请求</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-num">0</div>
                                <div class="stat-label">修改操作</div>
                            </div>
                        </div>

                        <div>
                            <div style="display:flex;justify-content:space-between;font-size:13px;color:#6b7280;margin-bottom:8px;">
                                <span>数据源：GitHub OpenAPI</span>
                                <span>安全只读</span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar"></div>
                            </div>
                        </div>
                    </div>

                    <h2 class="section-title">仓库入口</h2>
                    <div class="repo-grid" style="margin-bottom:0;">
                        <div class="repo-card" onclick="openCategory('frontend-notes')">
                            <div class="repo-icon python">🐍</div>
                            <h3>Python</h3>
                            <p>Python 学习笔记</p>
                        </div>

                        <div class="repo-card" onclick="openCategory('backend-notes')">
                            <div class="repo-icon linux">🐧</div>
                            <h3>运维</h3>
                            <p>Linux / Shell / 中间件</p>
                        </div>
                    </div>
                </div>

                <!-- 书架视图 -->
                <div id="shelfView" style="display:none;">
                    <div class="breadcrumb" id="pathBreadcrumb"></div>
                    <h2 class="section-title" id="categoryTitle"></h2>
                    <div class="file-grid" id="bookGrid"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- 文档弹窗 -->
    <div class="modal-mask" id="docModal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h3 class="modal-title" id="modalTitle"></h3>
                    <p class="modal-subtitle" id="modalMeta"></p>
                </div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="modal-body">
                <aside class="toc">
                    <h4>目录</h4>
                    <nav class="toc-list" id="tocList"></nav>
                </aside>

                <div class="doc" id="modalContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================
        // 仓库配置
        // ==============================================
        const REPO_CONFIG = [
            {
                key: 'frontend-notes',
                name: 'Python',
                desc: 'Python 学习笔记',
                owner: 'pengyi007',
                repo: 'Study_Python',
                branch: 'main',
                rootPath: ''
            },
            {
                key: 'backend-notes',
                name: '运维',
                desc: 'Linux / Shell / 中间件',
                owner: 'pengyi007',
                repo: 'Study_Ops',
                branch: 'main',
                rootPath: ''
            }
        ];

        const GITHUB_TOKEN = '';
        const API_BASE = 'https://api.github.com';

        let currentRepoKey = '';
        let currentPath = '';

        // ==============================================
        // 工具函数
        // ==============================================
        function base64ToUtf8(base64) {
            try {
                const binary = window.atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error('解码失败', e);
                return '';
            }
        }

        function getRawUrl(repoKey, filePath) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return '';
            return `https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/${repo.branch}/${filePath}`;
        }

        function resolveMarkdownImages(markdown, repoKey, currentFilePath) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return markdown;

            const dirPath = currentFilePath.includes('/')
                ? currentFilePath.substring(0, currentFilePath.lastIndexOf('/'))
                : '';

            return markdown.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, imgPath) => {
                if (imgPath.startsWith('http://') || imgPath.startsWith('https://') || imgPath.startsWith('data:')) {
                    return match;
                }

                let fullPath;
                if (imgPath.startsWith('/')) {
                    fullPath = imgPath.slice(1);
                } else {
                    fullPath = dirPath ? `${dirPath}/${imgPath}` : imgPath;
                }

                const rawUrl = getRawUrl(repoKey, fullPath);
                return `![${alt}](${rawUrl})`;
            });
        }

        // ==============================================
        // GitHub API
        // ==============================================
        async function githubRequest(url) {
            const headers = {
                Accept: 'application/vnd.github.v3+json'
            };
            if (GITHUB_TOKEN) {
                headers['Authorization'] = `token ${GITHUB_TOKEN}`;
            }

            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error('请求失败：' + res.status);
            return res.json();
        }

        async function getRepoContents(repoKey, path = '') {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return [];

            const fullPath = path ? path : repo.rootPath;
            const url = `${API_BASE}/repos/${repo.owner}/${repo.repo}/contents/${encodeURIComponent(fullPath)}?ref=${repo.branch}`;
            const data = await githubRequest(url);

            return data.sort((a, b) => {
                if (a.type === 'dir' && b.type === 'file') return -1;
                if (a.type === 'file' && b.type === 'dir') return 1;
                return a.name.localeCompare(b.name);
            });
        }

        async function getFileContent(repoKey, path) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return '';

            const url = `${API_BASE}/repos/${repo.owner}/${repo.repo}/contents/${encodeURIComponent(path)}?ref=${repo.branch}`;
            const data = await githubRequest(url);

            if (data.encoding === 'base64') {
                return base64ToUtf8(data.content);
            }
            return data.content || '';
        }

        // ==============================================
        // 初始化
        // ==============================================
        window.addEventListener('load', function () {
            renderSidebar();
        });

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';

            REPO_CONFIG.forEach(repo => {
                const sideIcon = repo.key === 'frontend-notes' ? '🐍' : '🐧';
                const sideColor = repo.key === 'frontend-notes'
                    ? 'linear-gradient(135deg,#38bdf8,#10b981)'
                    : 'linear-gradient(135deg,#1f2937,#166534)';

                const btn = document.createElement('button');
                btn.dataset.repoKey = repo.key;
                btn.innerHTML = `
                    <span class="sidebar-icon" style="background:${sideColor}">${sideIcon}</span>
                    ${repo.name}
                `;
                btn.onclick = () => openCategory(repo.key);
                nav.appendChild(btn);
            });
        }

        // ==============================================
        // 页面切换
        // ==============================================
        function enterLibrary() {
            const landing = document.getElementById('landingView');
            const app = document.getElementById('appView');

            landing.style.opacity = '0';
            landing.style.transform = 'translateY(-10px)';

            setTimeout(() => {
                landing.style.display = 'none';
                app.classList.add('show');
            }, 300);
        }

        function backToLanding() {
            const landing = document.getElementById('landingView');
            const app = document.getElementById('appView');

            app.classList.remove('show');
            landing.style.display = 'flex';

            setTimeout(() => {
                landing.style.opacity = '1';
                landing.style.transform = 'translateY(0)';
            }, 50);

            goHome();
            closeModal();
        }

        function goHome() {
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('shelfView').style.display = 'none';
            document.getElementById('homeBtn').classList.add('active');
            closeModal();
        }

        // ==============================================
        // 书架
        // ==============================================
        function openCategory(repoKey) {
            const repo = REPO_CONFIG.find(r => r.key === repoKey);
            if (!repo) return;

            currentRepoKey = repoKey;
            currentPath = repo.rootPath || '';

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('shelfView').style.display = 'block';
            document.getElementById('categoryTitle').textContent = repo.name;

            document.querySelectorAll('.sidebar-menu button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.repoKey === repoKey);
            });

            loadShelfData();
        }

        async function loadShelfData() {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;">加载中...</div>';
            renderBreadcrumb();

            try {
                const list = await getRepoContents(currentRepoKey, currentPath);
                grid.innerHTML = '';

                const rootPath = REPO_CONFIG.find(r => r.key === currentRepoKey).rootPath;

                if (currentPath && currentPath !== rootPath) {
                    const backCard = document.createElement('div');
                    backCard.className = 'file-card';
                    backCard.innerHTML = `
                        <div class="file-cover folder">📁</div>
                        <div class="file-body">
                            <h4 class="file-name">返回上级</h4>
                            <p class="file-meta">回到上一级目录</p>
                        </div>
                    `;
                    backCard.onclick = goBackDir;
                    grid.appendChild(backCard);
                }

                list.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'file-card';

                    if (item.type === 'dir') {
                        card.innerHTML = `
                            <div class="file-cover folder">📁</div>
                            <div class="file-body">
                                <h4 class="file-name">${item.name}</h4>
                                <p class="file-meta">文件夹</p>
                            </div>
                        `;
                        card.onclick = () => enterDir(item.path);
                        grid.appendChild(card);
                    } else {
                        const isViewable = /\.(md|txt|js|css|html|json|vue|py|java|go|ts|jsx|tsx|yml|yaml|conf|ini|png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(item.name);
                        if (!isViewable) return;

                        const isImage = /\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(item.name);
                        const coverClass = isImage ? 'img' : 'doc';
                        const coverIcon = isImage ? '🖼️' : '📄';

                        card.innerHTML = `
                            <div class="file-cover ${coverClass}">${coverIcon}</div>
                            <div class="file-body">
                                <h4 class="file-name">${item.name}</h4>
                                <p class="file-meta">${(item.size / 1024).toFixed(1)} KB</p>
                            </div>
                        `;
                        card.onclick = () => openDocFile(item.path, item.name);
                        grid.appendChild(card);
                    }
                });
            } catch (err) {
                grid.innerHTML = `<div style="text-align:center;padding:40px;color:#b91c1c;">加载失败：${err.message}</div>`;
            }
        }

        function renderBreadcrumb() {
            const breadcrumb = document.getElementById('pathBreadcrumb');
            const repo = REPO_CONFIG.find(r => r.key === currentRepoKey);
            const rootPath = repo.rootPath || '';

            let pathArr = [];
            if (currentPath) {
                pathArr = currentPath.replace(rootPath, '').split('/').filter(Boolean);
            }

            let html = `<a href="javascript:;" onclick="openCategory('${currentRepoKey}')">${repo.name}</a>`;

            let tempPath = rootPath;
            pathArr.forEach((dir, index) => {
                tempPath = tempPath ? `${tempPath}/${dir}` : dir;
                html += `<span class="sep">/</span>`;

                if (index === pathArr.length - 1) {
                    html += `<span class="current">${dir}</span>`;
                } else {
                    html += `<a href="javascript:;" onclick="jumpToPath('${tempPath}')">${dir}</a>`;
                }
            });

            breadcrumb.innerHTML = html;
        }

        function enterDir(path) {
            currentPath = path;
            loadShelfData();
        }

        function jumpToPath(path) {
            currentPath = path;
            loadShelfData();
        }

        function goBackDir() {
            const pathArr = currentPath.split('/');
            pathArr.pop();
            currentPath = pathArr.join('/');
            loadShelfData();
        }

        // ==============================================
        // 文档弹窗
        // ==============================================
        async function openDocFile(filePath, fileName) {
            const repo = REPO_CONFIG.find(r => r.key === currentRepoKey);

            document.getElementById('modalTitle').textContent = fileName;
            document.getElementById('modalMeta').textContent = `${repo.name} · ${filePath}`;
            document.getElementById('modalContent').innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;">加载中...</div>';
            document.getElementById('tocList').innerHTML = '';

            const modal = document.getElementById('docModal');
            modal.classList.add('show');

            try {
                const isImage = /\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i.test(fileName);
                if (isImage) {
                    const imgUrl = getRawUrl(currentRepoKey, filePath);
                    document.getElementById('modalContent').innerHTML = `
                        <div class="image-view">
                            <img src="${imgUrl}" alt="${fileName}" />
                        </div>
                    `;
                    return;
                }

                const isMarkdown = /\.md$/i.test(fileName);
                const content = await getFileContent(currentRepoKey, filePath);

                if (isMarkdown) {
                    const resolvedContent = resolveMarkdownImages(content, currentRepoKey, filePath);
                    const html = marked.parse(resolvedContent);
                    document.getElementById('modalContent').innerHTML = `<div class="markdown-body">${html}</div>`;
                    generateToc();
                } else {
                    document.getElementById('modalContent').innerHTML = `<pre>${content}</pre>`;
                }
            } catch (err) {
                document.getElementById('modalContent').innerHTML = `<div style="color:#b91c1c;text-align:center;padding:40px;">加载失败：${err.message}</div>`;
            }
        }

        function closeModal() {
            document.getElementById('docModal').classList.remove('show');
        }

        function generateToc() {
            const contentEl = document.getElementById('modalContent');
            const tocEl = document.getElementById('tocList');
            const headings = contentEl.querySelectorAll('h2, h3');

            if (headings.length === 0) {
                tocEl.innerHTML = '<div style="color:#9ca3af;font-size:13px;padding:8px 10px;">暂无目录</div>';
                return;
            }

            let html = '';
            headings.forEach((heading, index) => {
                const id = `heading-${index}`;
                heading.id = id;
                const level = heading.tagName.toLowerCase();
                const text = heading.textContent;
                html += `<div class="toc-item ${level}" onclick="scrollToHeading('${id}')">${text}</div>`;
            });
            tocEl.innerHTML = html;

            const contentScroll = document.getElementById('modalContent');
            contentScroll.onscroll = () => {
                let currentId = '';
                headings.forEach(heading => {
                    const rect = heading.getBoundingClientRect();
                    if (rect.top <= 80) {
                        currentId = heading.id;
                    }
                });

                document.querySelectorAll('.toc-item').forEach(item => {
                    item.classList.remove('active');
                });

                if (currentId) {
                    const activeItem = document.querySelector(`.toc-item[onclick="scrollToHeading('${currentId}')"]`);
                    if (activeItem) activeItem.classList.add('active');
                }
            };
        }

        function scrollToHeading(id) {
            const el = document.getElementById(id);
            if (el) {
                document.getElementById('modalContent').scrollTo({
                    top: el.offsetTop - 20,
                    behavior: 'smooth'
                });
            }
        }

        // ==============================================
        // 关闭弹窗
        // ==============================================
        document.getElementById('docModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
